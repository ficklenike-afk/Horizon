theme: jekyll-theme-cayman
title: Horizon 篮球球衣商业情报
description: 每日汇总篮球球衣的设计灵感、市场商机与工艺供应链情报
baseurl: "/Horizon" # the subpath of your site, e.g. /blog
url: "" # set by each fork owner for their own Pages hostname

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
